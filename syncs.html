<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FBFAFF">
<link rel="manifest" href="manifest.webmanifest?v=14">
<link rel="icon" href="icons/favicon.png?v=14">
<link rel="apple-touch-icon" href="icons/icon-192.png?v=14">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/main.css?v=14">
<title>Your syncs - TooSynced</title>
</head>
<body>

<div class="topbar">
  <span class="logo logo--md">T<svg width="23" height="15" viewBox="2 1 66 44" fill="none" aria-hidden="true"><circle cx="24" cy="23" r="17.5" stroke="#7C3AED" stroke-width="9"/><circle cx="46" cy="23" r="17.5" stroke="#4C1D95" stroke-width="9"/></svg>Synced</span>
  <div class="right">
    <a href="settings.html" style="font-size:14px;color:var(--subtle);font-weight:500;">Settings</a>
    <a href="profile.html" id="me-avatar" title="Your profile" style="display:inline-flex;"></a>
  </div>
</div>

<div class="page">
  <div class="hub">
    <div class="hub-head">
      <div>
        <h1>Your syncs</h1>
        <p id="hub-sub">Pick one to jump into, or start a new one.</p>
      </div>
    </div>

    <div id="sync-list" style="display:flex;flex-direction:column;gap:12px;"></div>

    <!-- create -->
    <div class="card" style="padding:22px;display:flex;flex-direction:column;gap:16px;">
      <b style="font-size:16px;font-weight:700;">Start a new sync</b>
      <div id="plan-note" style="font-size:13px;color:var(--muted);font-weight:400;line-height:1.5;"></div>
      <div class="create-grid">
        <button class="create-opt on" data-kind="two" type="button">
          <span class="ic">🫂</span>
          <b>Two Sync</b>
          <span>Just you and one other person. Side-by-side days, private.</span>
        </button>
        <button class="create-opt" data-kind="group" type="button">
          <span class="ic">👥</span>
          <b>Group Sync</b>
          <span>Three or more. Everyone sees everyone, plus group chat.</span>
        </button>
      </div>

      <div class="photo-pick">
        <div class="preview" id="sync-photo-preview">🫂</div>
        <div class="acts">
          <button class="btn btn--ghost" type="button" id="btn-sync-photo">Add a photo</button>
          <button class="btn btn--ghost hidden" type="button" id="btn-sync-photo-clear" style="color:#B03A52;">Remove</button>
          <input type="file" accept="image/*,.heic,.heif" id="sync-photo-input" class="hidden">
        </div>
      </div>

      <div class="field">
        <label for="sync-name">Name it</label>
        <input class="input" id="sync-name" placeholder="Me & Jordan" maxlength="40">
      </div>

      <div class="error-msg hidden" id="create-error"></div>
      <button class="btn btn--primary" id="btn-create-sync" style="align-self:flex-start;">Create sync</button>
    </div>

    <!-- join -->
    <div class="card" style="padding:22px;display:flex;flex-direction:column;gap:12px;">
      <b style="font-size:16px;font-weight:700;">Join with an invite code</b>
      <div class="error-msg hidden" id="join-error"></div>
      <div class="join-row">
        <input class="input" id="join-code" placeholder="V7K-2BE" maxlength="8" style="flex:1;">
        <button class="btn btn--outline" id="btn-join">Join</button>
      </div>
    </div>
  </div>
</div>

<script src="capacitor.js"></script>
<script src="assets/js/config.js?v=14"></script>
<script>
  if (!CONFIG.DEMO_MODE) {
    document.write('<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"><\/script>');
    document.write('<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"><\/script>');
    document.write('<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"><\/script>');
  }
</script>
<script src="assets/js/store.js?v=14"></script>
<script src="assets/js/ui.js?v=14"></script>
<script src="assets/js/native.js?v=14"></script>
<script src="assets/js/plan.js?v=14"></script>
<script src="assets/js/pro.js?v=14"></script>
<script src="assets/js/syncs.js?v=14"></script>
</body>
</html>
