<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Settings — TooSynced</title>
<meta name="theme-color" content="#FBFAFF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/main.css">
</head>
<body>

<div class="topbar">
  <span class="logo logo--md"><svg class="mark" width="24" height="24" viewBox="0 0 100 100" fill="none" aria-hidden="true" style="align-self:center;margin-right:7px;"><rect x="12" y="18" width="76" height="68" rx="18" stroke="#B79AF7" stroke-width="9"/><path d="M12 36h76" stroke="#B79AF7" stroke-width="9"/><circle cx="41" cy="61" r="15" stroke="#7C3AED" stroke-width="9"/><circle cx="59" cy="61" r="15" stroke="#4C1D95" stroke-width="9"/></svg>T<svg width="23" height="15" viewBox="2 1 66 44" fill="none" aria-hidden="true"><circle cx="24" cy="23" r="17.5" stroke="#7C3AED" stroke-width="9"/><circle cx="46" cy="23" r="17.5" stroke="#4C1D95" stroke-width="9"/></svg>Synced</span>
  <nav class="topnav">
    <a href="app.html">Schedule</a>
    <a href="streaks.html">Streaks</a>
    <a href="settings.html" class="on">Settings</a>
  </nav>
  <div class="right">
    <span class="av av--me av--32" id="me-avatar">·</span>
  </div>
</div>

<div class="page">
  <div class="settings-wrap">

    <div class="settings-card">
      <b>Profile</b>
      <div class="field">
        <label for="s-name">Your name</label>
        <input class="input" id="s-name" placeholder="Your name" maxlength="30">
      </div>
      <div class="field">
        <label for="s-phone">Phone number <span class="opt">optional</span></label>
        <input class="input" type="tel" id="s-phone" placeholder="(951) 555-0134" autocomplete="tel">
      </div>
      <button class="btn btn--primary" id="btn-save-name" style="align-self:flex-start;">Save profile</button>
    </div>

    <div class="settings-card">
      <b>Your pair</b>
      <div class="step done" id="pair-status"><span class="n">✓</span> <span id="pair-status-text">Checking…</span></div>
      <div class="field" style="gap:9px;">
        <span class="invite-label">INVITE LINK</span>
        <div class="invite-row">
          <div class="invite-link" id="invite-link">—</div>
          <button class="btn btn--ghost" id="btn-copy">Copy</button>
        </div>
      </div>
    </div>

    <div class="settings-card">
      <b>Notifications</b>
      <p style="font-size:14px;color:var(--muted);line-height:1.5;">Nudges chime and pop a notification while TooSynced is open. Allow notifications so you don't miss them.</p>
      <button class="btn btn--ghost" id="btn-notif" style="align-self:flex-start;">Enable notifications</button>
      <button class="btn btn--ghost" id="btn-test-chime" style="align-self:flex-start;">Test the chime 🔔</button>
    </div>

    <div class="settings-card">
      <b>Account</b>
      <button class="btn btn--ghost" id="btn-signout" style="align-self:flex-start;">Sign out</button>
      <button class="btn btn--ghost hidden" id="btn-reset-demo" style="align-self:flex-start;color:#B03A52;">Reset demo data</button>
    </div>

  </div>
</div>

<script src="assets/js/config.js"></script>
<script>
  if (!CONFIG.DEMO_MODE) {
    document.write('<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"><\/script>');
    document.write('<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"><\/script>');
    document.write('<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"><\/script>');
  }
</script>
<script src="assets/js/store.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/settings.js"></script>
</body>
</html>
