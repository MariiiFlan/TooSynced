<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Schedule - TooSynced</title>
<meta name="theme-color" content="#FBFAFF">
<link rel="manifest" href="manifest.webmanifest?v=27">
<link rel="icon" href="icons/favicon.png?v=27">
<link rel="apple-touch-icon" href="icons/icon-192.png?v=27">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script>
(function(){try{
  var m=localStorage.getItem("ts_mode")||"auto";
  var d=m==="dark"||(m==="auto"&&window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.setAttribute("data-mode",d?"dark":"light");
  if(d){var t=document.querySelector('meta[name="theme-color"]');if(t)t.setAttribute("content","#0B0B0D");}
}catch(e){}})();
</script>
<link rel="stylesheet" href="assets/css/main.css?v=27">
</head>
<body>

<div class="topbar">
  <span class="logo logo--md">T<svg width="23" height="15" viewBox="2 1 66 44" fill="none" aria-hidden="true"><circle cx="24" cy="23" r="17.5" stroke="#7C3AED" stroke-width="9"/><circle cx="46" cy="23" r="17.5" stroke="#4C1D95" stroke-width="9"/></svg>Synced</span>
  <nav class="topnav">
    <a href="app.html" class="on">Schedule</a>
    <a href="chat.html">Chat</a>
    <a href="streaks.html">Streaks</a>
    <a href="settings.html">Settings</a>
  </nav>
  <div class="right">
    <div class="streak-pill"><span class="flame-wrap"><span class="flame-glow"></span><span class="flame">🔥</span></span><span class="label-txt" id="streak-label">- streak</span></div>
    <div class="sync-switch" id="sync-switch"></div>
  </div>
</div>

<div class="page">
  <div class="sched-sticky">
  <div class="sched-head">
    <div class="left">
      <h1 id="date-title">Today</h1>
      <div class="datenav">
        <button id="nav-prev" aria-label="Previous">‹</button>
        <button id="nav-next" aria-label="Next">›</button>
        <button id="nav-today" class="today-btn">Today</button>
      </div>
    </div>
    <div class="viewseg" role="tablist">
      <button class="on" data-view="day">Day</button>
      <button data-view="week">Week</button>
      <button data-view="month">Month</button>
    </div>
  </div>

  <div class="mobile-tabs" id="mobile-tabs"></div>
  </div>

  <div id="proposal-mount"></div>

  <div id="ping-mount"></div>

  <div id="syncling-mount"></div>

  <div id="chores-mount"></div>

  <div id="view-day">
    <div class="cols" id="day-cols"></div>
  </div>

  <div id="view-week" class="hidden"><div class="week-grid" id="week-grid"></div></div>
  <div id="view-month" class="hidden"><div class="month-grid" id="month-grid"></div></div>
</div>

<button class="fab" id="fab-add" aria-label="Add task"><span>+</span></button>

<!-- TASK MODAL -->
<div class="modal-veil" id="task-modal">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-head">
      <div class="t"><b id="modal-title">New task</b><span id="modal-sub">Adding to my day</span></div>
      <button class="modal-x" id="modal-close" aria-label="Close">✕</button>
    </div>
    <div class="modal-body">

      <div class="field">
        <label for="t-name">What are you doing?</label>
        <input class="input" id="t-name" placeholder="e.g. Gym, Read, Call mom" maxlength="60"
               autocomplete="off" autocapitalize="sentences" style="font-size:17px;">
      </div>

      <div class="field">
        <label>Icon</label>
        <div class="icon-row" id="icon-row"></div>
        <span style="font-size:12px;color:var(--faint);font-weight:400;">Tap the last box to type any emoji you want.</span>
      </div>

      <div class="field">
        <label>When</label>
        <div class="pills" id="when-pills">
          <button class="pill on" data-when="anytime" type="button">Anytime that day</button>
          <button class="pill" data-when="time" type="button">At a set time</button>
        </div>
        <input class="input hidden" type="time" id="t-time" value="18:30" style="margin-top:8px;">
      </div>

      <div class="field">
        <label for="t-date">Starting</label>
        <input class="input" type="date" id="t-date">
      </div>

      <div class="field" style="gap:9px;">
        <label>Repeat</label>
        <div class="pills" id="repeat-pills">
          <button class="pill on" data-rep="none" type="button">Just once</button>
          <button class="pill" data-rep="daily" type="button">Daily</button>
          <button class="pill" data-rep="weekdays" type="button">Weekdays</button>
          <button class="pill" data-rep="weekly" type="button">Weekly</button>
          <button class="pill" data-rep="custom" type="button">Custom days</button>
        </div>
        <div class="day-picks hidden" id="day-picks">
          <button class="day-pick" data-d="1" type="button">M</button>
          <button class="day-pick" data-d="2" type="button">T</button>
          <button class="day-pick" data-d="3" type="button">W</button>
          <button class="day-pick" data-d="4" type="button">T</button>
          <button class="day-pick" data-d="5" type="button">F</button>
          <button class="day-pick" data-d="6" type="button">S</button>
          <button class="day-pick" data-d="0" type="button">S</button>
        </div>
      </div>

      <div class="field">
        <label for="t-place">Where <span class="opt">optional</span></label>
        <input class="input" id="t-place" placeholder="e.g. Gold's Gym, Perris" maxlength="120" autocomplete="off">
        <span style="font-size:12px;color:var(--faint);font-weight:400;">Anyone in the sync can tap it to open directions.</span>
      </div>

      <div class="field">
        <label for="t-note">Note <span class="opt">optional</span></label>
        <textarea class="input" id="t-note" placeholder="Anything you want to remember"></textarea>
      </div>

      <div class="field" style="gap:9px;">
        <label>Who sees this</label>
        <div class="pills" id="scope-pills">
          <button class="pill on" data-scope="sync" type="button">This sync</button>
          <button class="pill" data-scope="shared" type="button">Everyone</button>
          <button class="pill" data-scope="all" type="button">All my syncs</button>
          <button class="pill" data-scope="pick" type="button">Pick syncs</button>
          <button class="pill" data-scope="private" type="button">Private</button>
        </div>
        <div id="scope-pick-list" class="hidden" style="display:flex;flex-direction:column;gap:8px;padding-top:4px;"></div>
        <span style="font-size:12px;color:var(--faint);font-weight:400;" id="scope-hint">Everyone in this sync can see it.</span>
      </div>

      <button class="toggle-row" id="rsvp-toggle" type="button">
        <span class="switch" id="rsvp-switch"><i></i></span>
        <span>Open invite - let people say if they're coming</span>
      </button>

      <button class="toggle-row" id="nudge-toggle" type="button">
        <span class="switch on" id="nudge-switch"><i></i></span>
        <span id="nudge-toggle-label">Let people nudge me about this</span>
      </button>
    </div>
    <div class="modal-foot">
      <button class="del hidden" id="modal-delete">Delete</button>
      <div class="spacer">
        <button class="btn btn--ghost" id="modal-cancel">Cancel</button>
        <button class="btn btn--primary" id="modal-save">Save task</button>
      </div>
    </div>
  </div>
</div>

<!-- TASK DETAIL -->
<div class="modal-veil" id="detail-modal">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="d-title">
    <div class="modal-head">
      <div class="t" style="flex-direction:row;align-items:center;gap:12px;">
        <span id="d-icon" style="font-size:28px;"></span>
        <div style="display:flex;flex-direction:column;min-width:0;">
          <b id="d-title">Task</b>
          <span id="d-when">-</span>
        </div>
      </div>
      <button class="modal-x" id="d-close" aria-label="Close">✕</button>
    </div>
    <div class="modal-body">
      <div id="d-owner" style="display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted);font-weight:500;"></div>
      <a id="d-place" class="hidden" target="_blank" rel="noopener"
         style="display:flex;align-items:center;gap:11px;background:var(--chip-bg);border:1px solid var(--chip-border);border-radius:14px;padding:14px 16px;text-decoration:none;">
        <span style="font-size:20px;">📍</span>
        <span style="display:flex;flex-direction:column;min-width:0;">
          <b id="d-place-text" style="font-size:15px;color:var(--deep);"></b>
          <span style="font-size:12px;color:var(--primary);font-weight:600;">Tap for directions</span>
        </span>
      </a>
      <div id="d-note-wrap" class="hidden field">
        <label>Note</label>
        <div id="d-note" style="font-size:15px;line-height:1.55;color:var(--ink);background:var(--bg-alt);border-radius:14px;padding:14px 16px;white-space:pre-wrap;"></div>
      </div>
      <div id="d-rsvp-wrap" class="hidden field" style="gap:10px;">
        <label>Are you coming?</label>
        <div class="pills" id="d-rsvp-pills">
          <button class="pill" data-rsvp="in" type="button">✅ I'm in</button>
          <button class="pill" data-rsvp="maybe" type="button">🤔 Maybe</button>
          <button class="pill" data-rsvp="out" type="button">❌ Can't</button>
        </div>
        <div id="d-rsvp-list" style="display:flex;flex-direction:column;gap:9px;padding-top:4px;"></div>
      </div>
      <div id="d-history-wrap" class="hidden field">
        <label>Track record</label>
        <div id="d-history" class="hist"></div>
      </div>
      <div id="d-snooze-wrap" class="hidden">
        <button class="btn btn--ghost btn--block" id="d-snooze">Not today - push it back</button>
      </div>
      <div id="d-praise-wrap" class="hidden field">
        <label>Cheers</label>
        <div id="d-praise-list" style="display:flex;flex-wrap:wrap;gap:8px;"></div>
      </div>
    </div>
    <div class="modal-foot">
      <div class="spacer" style="margin-left:0;width:100%;">
        <button class="btn btn--ghost" id="d-action" style="flex:1;">Close</button>
        <button class="btn btn--primary hidden" id="d-edit">Edit</button>
      </div>
    </div>
  </div>
</div>

<script src="capacitor.js"></script>
<script src="assets/js/config.js?v=27"></script>
<script>
  if (!CONFIG.DEMO_MODE) {
    document.write('<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"><\/script>');

    document.write('<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"><\/script>');
  }
</script>

<script src="assets/js/items.js?v=27"></script>
<script src="assets/js/syncling.js?v=27"></script>
<script src="assets/js/syncling-ui.js?v=27"></script>
<script src="assets/js/extras.js?v=27"></script>
<script src="assets/js/push.js?v=27"></script>
<script src="assets/js/pro.js?v=27"></script>
<script src="assets/js/app.js?v=27"></script>
</body>
</html>
